<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Россия Онлайн Хэлпер</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/app_icon.png">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(ellipse 70% 50% at 15% 0%,rgba(47,146,255,.2),transparent 60%),#050b16;
    color:#edf5ff;font:15px/1.6 "Segoe UI",system-ui,sans-serif;text-align:center}
  .card{max-width:460px;padding:34px 28px;border-radius:22px;border:1px solid rgba(92,151,221,.22);
    background:linear-gradient(160deg,rgba(13,29,51,.95),rgba(8,18,33,.95));box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .code{font-size:64px;font-weight:800;line-height:1;letter-spacing:-3px;
    background:linear-gradient(100deg,#8cc4ff,#b9a4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;margin:10px 0 8px}
  p{margin:0 0 20px;color:#93a9c8;font-size:13px}
  a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;
    background:linear-gradient(115deg,#2f92ff,#7a5cff);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вернись на главную — там всё, что нужно.</p>
    <a href="index.html">← На главную</a>
  </div>
</body>
</html>
